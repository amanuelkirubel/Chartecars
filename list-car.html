<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charte Cars Admin | Add Listing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Shown while we check who's asking -->
    <div id="checking" class="text-slate-400 font-bold text-sm">Checking access...</div>

    <!-- Shown if not an admin -->
    <div id="denied" class="hidden bg-white w-full max-w-md rounded-2xl shadow-xl p-10 text-center">
        <h1 class="text-xl font-black text-slate-800 mb-2">Access Denied</h1>
        <p class="text-slate-500 text-sm mb-6">This page is for Charte Cars admins only.</p>
        <button onclick="window.location.href='index.html'" class="text-blue-600 font-bold text-xs hover:underline">← Back to Home</button>
    </div>

    <!-- The actual form, hidden until we confirm admin -->
    <div id="adminForm" class="hidden bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-[#003399] p-6 text-white">
            <h1 class="text-xl font-bold italic">CHARTE <span class="text-blue-300">CARS</span> ADMIN</h1>
            <p class="text-xs opacity-70">Add a new car to the marketplace</p>
        </div>

        <form id="addCarForm" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Car Name / Model</label>
                <input type="text" id="name" placeholder="e.g. Toyota Hilux 2023" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Price (ETB)</label>
                    <input type="number" id="price" placeholder="4,500,000" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Location</label>
                    <input type="text" id="location" placeholder="Addis Ababa" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Image URL</label>
                <input type="url" id="image_url" placeholder="Link to photo" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Seller Phone Number</label>
                <input type="text" id="phone" placeholder="+251..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="flex items-center space-x-4 py-2">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="is_urgent" class="w-4 h-4 text-blue-600">
                    <span class="text-sm font-bold text-yellow-600">Mark as URGENT</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-[#003399] text-white font-black py-4 rounded-xl uppercase tracking-widest hover:bg-blue-800 transition shadow-lg">
                Upload to Website
            </button>
        </form>
    </div>

    <script>
        const SB_URL = 'https://oilalzzaieqrgclsmdrh.supabase.co';
        const SB_KEY = 'sb_publishable_HdfQonK2Jv-rLyi9E4uPxw_pCa-1pt1';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function checkAdminAccess() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                // Not logged in at all — send to login, then back here
                window.location.href = 'login.html';
                return;
            }

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('is_admin')
                .eq('id', user.id)
                .single();

            document.getElementById('checking').classList.add('hidden');

            if (error || !profile || !profile.is_admin) {
                document.getElementById('denied').classList.remove('hidden');
                return;
            }

            // Confirmed admin — show the form
            document.getElementById('adminForm').classList.remove('hidden');
        }

        checkAdminAccess();

        const form = document.getElementById('addCarForm');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'UPLOADING...';

            const carData = {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                location: document.getElementById('location').value,
                image_url: document.getElementById('image_url').value,
                phone_number: document.getElementById('phone').value,
                is_urgent: document.getElementById('is_urgent').checked
            };

            const { error } = await supabaseClient
                .from('car_listings')
                .insert([carData]);

            if (error) {
                alert('Error: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Upload to Website';
            } else {
                alert('✅ Car listed successfully! Refresh your home page to see it.');
                form.reset();
                btn.disabled = false;
                btn.innerText = 'Upload to Website';
            }
        });
    </script>
</body>
</html>
