<!-- 1. The Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 2. Your Specific Connection Details (Adjusted)
    const SB_URL = 'https://oilalzzaieqrgclsmdrh.supabase.co';
    const SB_KEY = 'sb_publishable_HdfQonK2Jv-rLyi9E4uPxw_pCa-1pt1'; 
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 3. Function to load cars from your database
    async function loadCars() {
        const { data: cars, error } = await supabaseClient
            .from('car_listings')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Error loading cars:', error);
            return;
        }

        const container = document.getElementById('car-grid');
        if (!container) return; 

        // If no cars exist yet, show a message
        if (cars.length === 0) {
            container.innerHTML = '<div class="col-span-3 text-center py-10 text-gray-500">No cars listed yet. Please add your first car in Supabase!</div>';
            return;
        }

        container.innerHTML = ''; // Clear the container

        cars.forEach(car => {
            container.innerHTML += `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200 relative hover:shadow-xl transition duration-300">
                    <!-- Ribbons for Urgent/Sold -->
                    ${car.is_urgent ? '<div class="absolute top-4 right-0 bg-yellow-500 text-white text-[10px] font-black px-4 py-1 uppercase z-40">Urgent</div>' : ''}
                    ${car.is_sold ? '<div class="absolute top-4 right-0 bg-red-600 text-white text-[10px] font-black px-4 py-1 uppercase z-40">Sold</div>' : ''}
                    
                    <!-- Car Photo -->
                    <div class="h-56 bg-slate-100">
                        <img src="${car.image_url || 'https://via.placeholder.com/400x300?text=Car+Photo+Coming+Soon'}" class="w-full h-full object-cover">
                    </div>

                    <div class="p-6">
                        <p class="text-blue-600 font-bold text-[11px] uppercase tracking-widest mb-1">${car.location}</p>
                        <h3 class="text-xl font-black text-slate-800 mb-2">${car.name}</h3>
                        <div class="text-2xl font-black text-[#003399] mb-4">${Number(car.price).toLocaleString()} <span class="text-xs font-normal">ETB</span></div>
                        
                        <!-- The Paid Gate Alert -->
                        <button onclick="alert('PRIVATE MARKETPLACE: To view the seller phone number and full details, you must be a registered member. Payment: 500 ETB.')" 
                                class="w-full border-2 border-[#003399] text-[#003399] font-black py-3 rounded-lg uppercase text-xs hover:bg-[#003399] hover:text-white transition">
                            Learn More
                        </button>
                    </div>
                </div>
            `;
        });
    }

    // Run the function
    loadCars();
</script>
