<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charte Cars | Find Your Dream Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* This ensures the video covers the background properly */
        .video-docker video {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
        }
        .hero-overlay {
            background: rgba(0, 0, 30, 0.6); /* Dark blue tint */
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-8 py-4 bg-[#003399] text-white shadow-lg">
        <div class="flex items-center space-x-2">
            <!-- Replace with your actual logo path later -->
            <div class="text-2xl font-black italic tracking-tighter">CHARTE <span class="text-slate-300">CARS</span></div>
        </div>
        <div class="hidden md:flex space-x-8 font-semibold">
            <a href="#" class="hover:text-blue-200">BUY</a>
            <a href="#" class="hover:text-blue-200">SELL</a>
            <a href="#" class="hover:text-blue-200">RENT</a>
        </div>
        <button class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-md font-bold transition">
            + LIST A CAR
        </button>
    </nav>

    <!-- Hero Section with Video Background -->
    <section class="relative h-[80vh] flex items-center justify-center overflow-hidden">
        <div class="video-docker absolute top-0 left-0 w-full h-full overflow-hidden">
            <!-- VIDEO SOURCE: Replace 'background.mp4' with your actual clean video file -->
            <video class="min-w-full min-h-full absolute object-cover" 
                src="https://assets.mixkit.co/videos/preview/mixkit-fast-driving-in-a-modern-city-at-night-39968-large.mp4" 
                type="video/mp4" autoplay muted loop playsinline></video>
        </div>
        
        <div class="hero-overlay absolute top-0 left-0 w-full h-full"></div>

        <div class="relative z-10 text-center text-white px-4">
            <p class="uppercase tracking-widest text-sm mb-2 text-blue-300">Ethiopia, Car by Car</p>
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6">Find a car you can <br> actually see yourself in.</h1>
            
            <!-- Search Bar -->
            <div class="bg-white p-2 rounded-lg shadow-2xl flex flex-wrap md:flex-nowrap items-center max-w-4xl mx-auto">
                <select class="text-gray-700 w-full md:w-1/4 p-3 border-r outline-none">
                    <option>All Cities</option>
                    <option>Addis Ababa</option>
                    <option>Hawassa</option>
                </select>
                <input type="number" placeholder="Min Price (ETB)" class="text-gray-700 w-full md:w-1/4 p-3 border-r outline-none">
                <input type="number" placeholder="Max Price (ETB)" class="text-gray-700 w-full md:w-1/4 p-3 border-r outline-none">
                <button class="w-full md:w-1/4 bg-blue-700 hover:bg-blue-800 text-white font-bold p-3 rounded-md transition">
                    SEARCH CARS
                </button>
            </div>
        </div>
    </section>

    <!-- Listings Section -->
    <main class="max-w-7xl mx-auto py-12 px-6">
        <h2 class="text-3xl font-bold mb-8 text-slate-800">Recent Listings</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Sample Car Card 1 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition relative">
                <div class="absolute top-4 left-4 bg-yellow-500 text-white px-3 py-1 text-xs font-bold rounded z-10">URGENT</div>
                <img src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg?auto=compress&cs=tinysrgb&w=600" class="w-full h-56 object-cover">
                <div class="p-6">
                    <p class="text-blue-600 font-bold text-xs mb-1">ADDIS ABABA</p>
                    <h3 class="text-xl font-bold mb-2 text-slate-800">BMW M3 - 2022</h3>
                    <p class="text-2xl font-black text-blue-900 mb-4">4,500,000 ETB</p>
                    <div class="flex justify-between text-sm text-gray-500 border-t pt-4">
                        <span>Petrol</span>
                        <span>Automatic</span>
                        <span>12,000 KM</span>
                    </div>
                    <button class="w-full mt-4 border-2 border-blue-700 text-blue-700 font-bold py-2 rounded hover:bg-blue-700 hover:text-white transition">LEARN MORE</button>
                </div>
            </div>

            <!-- Sample Car Card 2 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition relative">
                <div class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 text-xs font-bold rounded z-10">SOLD</div>
                <img src="https://images.pexels.com/photos/116675/pexels-photo-116675.jpeg?auto=compress&cs=tinysrgb&w=600" class="w-full h-56 object-cover opacity-75">
                <div class="p-6">
                    <p class="text-blue-600 font-bold text-xs mb-1">HAWASSA</p>
                    <h3 class="text-xl font-bold mb-2 text-slate-800">Toyota Corolla</h3>
                    <p class="text-2xl font-black text-blue-900 mb-4">2,100,000 ETB</p>
                    <div class="flex justify-between text-sm text-gray-500 border-t pt-4">
                        <span>Petrol</span>
                        <span>Manual</span>
                        <span>45,000 KM</span>
                    </div>
                    <button class="w-full mt-4 border-2 border-gray-300 text-gray-400 font-bold py-2 rounded cursor-not-allowed">SOLD OUT</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
