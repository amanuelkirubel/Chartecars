<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Charte Cars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
        <h1 class="text-3xl font-black text-[#003399] italic mb-2">CHARTE CARS</h1>
        <p class="text-gray-500 mb-8 font-bold text-sm uppercase tracking-widest">Customer Portal</p>

        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="Email Address" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="password" id="password" placeholder="Password" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required>
            
            <button type="submit" id="submitBtn" class="w-full bg-[#003399] text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-800 transition uppercase tracking-widest">
                Log In / Sign Up
            </button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-6 italic">If you don't have an account, one will be created for you automatically.</p>
    </div>

    <script>
        const SB_URL = 'https://oilalzzaieqrgclsmdrh.supabase.co';
        const SB_KEY = 'sb_publishable_HdfQonK2Jv-rLyi9E4uPxw_pCa-1pt1'; 
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        const form = document.getElementById('loginForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Try to log in
            let { data, error } = await supabase.auth.signInWithPassword({ email, password });

            // If login fails, try to sign up
            if (error) {
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
                if (signUpError) {
                    alert("Error: " + signUpError.message);
                } else {
                    alert("Welcome! Account created. Redirecting...");
                    window.location.href = 'index.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
