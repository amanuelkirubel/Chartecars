<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charte Cars | Find Your Dream Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hero-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        video { min-width: 100%; min-height: 100%; width: auto; height: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 51, 153, 0.5); z-index: 10; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Navigation Bar -->
    <nav class="relative z-50 flex items-center justify-between px-6 py-4 bg-[#003399] text-white shadow-lg">
        <div class="text-2xl font-black italic tracking-tighter">CHARTE <span class="text-slate-300">CARS</span></div>
        <div class="hidden md:flex space-x-8 font-semibold uppercase text-xs">
            <a href="#" class="hover:text-blue-200">Buy</a>
            <a href="#" class="hover:text-blue-200">Sell</a>
            <a href="#" class="hover:text-blue-200">Rent</a>
        </div>
        <a href="#" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded font-bold text-xs">+ LIST A CAR</a>
    </nav>

    <!-- Hero Section with Background Video -->
    <header class="relative h-[70vh] flex items-center justify-center text-center px-4">
        <div class="hero-video-container">
            <video autoplay muted loop playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-fast-car-driving-on-a-road-at-night-40333-large.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
        </div>
        <div class="relative z-20 max-w-4xl">
            <p class="text-blue-300 font-bold tracking-[0.3em] uppercase text-[10px] mb-4">Ethiopia, Car by Car</p>
            <h1 class="text-white text-4xl md:text-6xl font-black leading-tight mb-8 uppercase">Find a car you can <br> actually see yourself in.</h1>
            <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl flex flex-col md:flex-row w-full gap-2 border border-white/20">
                <select class="flex-1 bg-white p-4 rounded-lg text-gray-700 font-bold focus:outline-none"><option>All Cities</option></select>
                <input type="text" placeholder="Price Range" class="flex-1 bg-white p-4 rounded-lg text-gray-700 focus:outline-none">
                <button class="bg-[#003399] text-white font-black px-10 py-4 rounded-lg uppercase text-sm">Search</button>
            </div>
        </div>
    </header>

    <!-- THE LIVE MARKETPLACE SECTION -->
    <main class="max-w-7xl mx-auto py-16 px-6">
        <h2 class="text-2xl font-black text-slate-800 mb-8 border-l-4 border-blue-600 pl-4 uppercase">Latest Listings</h2>
        
        <!-- THIS ID "car-grid" IS WHERE THE SCRIPT PUTS THE CARS -->
        <div id="car-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="col-span-3 text-center py-20 text-gray-400 font-bold">Connecting to Database...</div>
        </div>
    </main>

    <!-- THE SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://oilalzzaieqrgclsmdrh.supabase.co';
        const SB_KEY = 'sb_publishable_HdfQonK2Jv-rLyi9E4uPxw_pCa-1pt1'; 
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function loadCars() {
            const { data: cars, error } = await supabaseClient
                .from('car_listings')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { console.error('Error:', error); return; }

            const container = document.getElementById('car-grid');
            if (!container) return;

            if (cars.length === 0) {
                container.innerHTML = '<div class="col-span-3 text-center py-10 text-gray-500 font-bold">No cars listed yet. Go to Supabase and add a row!</div>';
                return;
            }

            container.innerHTML = '';
            cars.forEach(car => {
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200 relative hover:shadow-xl transition duration-300">
                        ${car.is_urgent ? '<div class="absolute top-4 right-0 bg-yellow-500 text-white text-[10px] font-black px-4 py-1 uppercase z-40">Urgent</div>' : ''}
                        ${car.is_sold ? '<div class="absolute top-4 right-0 bg-red-600 text-white text-[10px] font-black px-4 py-1 uppercase z-40">Sold</div>' : ''}
                        <div class="h-56 bg-slate-100">
                            <img src="${car.image_url || 'https://via.placeholder.com/400x300?text=Charte+Cars'}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-6">
                            <p class="text-blue-600 font-bold text-[10px] uppercase tracking-widest mb-1">${car.location}</p>
                            <h3 class="text-xl font-black text-slate-800 mb-2">${car.name}</h3>
                            <div class="text-2xl font-black text-[#003399] mb-4">${Number(car.price).toLocaleString()} <span class="text-xs font-normal text-gray-500">ETB</span></div>
                            <button onclick="alert('PRIVATE MARKETPLACE: To view full details, pay 500 ETB.')" class="w-full border-2 border-[#003399] text-[#003399] font-black py-3 rounded-lg uppercase text-[11px] hover:bg-[#003399] hover:text-white transition">Learn More</button>
                        </div>
                    </div>
                `;
            });
        }
        loadCars();
    </script>
</body>
</html>
