<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Charte Cars Ethiopia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-6 relative overflow-hidden">

    <!-- Decorative Background Circles -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full blur-[120px] opacity-20"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-800 rounded-full blur-[120px] opacity-20"></div>

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 relative z-10 border border-white/10">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-[#003399] italic tracking-tighter mb-2">CHARTE <span class="text-blue-400">CARS</span></h1>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em]">Marketplace Portal</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" 
                       class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition font-medium" required>
            </div>
            
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                       class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition font-medium" required>
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full bg-[#003399] text-white font-black py-5 rounded-2xl shadow-xl hover:bg-blue-800 transition-all active:scale-95 uppercase tracking-widest text-xs">
                Log In / Sign Up
            </button>
        </form>

        <!-- Footer Info -->
        <div class="mt-8 pt-8 border-t border-slate-50 text-center">
